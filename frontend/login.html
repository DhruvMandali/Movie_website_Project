
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Movie App</title>
  <link rel="stylesheet" href="style.css">
    <script src="./js/dakmode.js" defer></script>
</head>
<body class="dark">
  <nav>
    <h2>Movie</h2>
    <div class="nav-links">
      <a href="index.html">Movies</a>
      <div id="authArea" style="display: inline;"></div>
      <a href="favorites.html">My Favorites ❤️</a>
      <button id="toggleMode">🌙</button>
    </div>
  </nav>
  <main class="auth-container">
    <h1>Login</h1>

    <form id="loginForm">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        required
      >

      <button type="submit">Login</button>
      <p id="message" role="status"></p>
    </form>

    <p>Don't have an account?
      <a href="register.html">Register here</a>
    </p>

    <a href="index.html">Back to Home</a>
  </main>

    <footer>
    <h2>Movie</h2>
    <p><span style="font-weight: bold;margin-right: 30px;"> Developer:- Dhruv Mandali </span>©2026 All Rights Reserved
    </p>
  </footer>
  <script src="js/login.js"></script>
</body>
</html>
